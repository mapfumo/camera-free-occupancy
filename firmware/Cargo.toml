[package]
name = "coworkos-firmware"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.1.1"
defmt-rtt = "1.3.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32u585ai", "memory-x", "time-driver-any", "exti"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-hal = "1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1

[build-dependencies]
bindgen = "0.72.1"
cc = "1.4.0"
